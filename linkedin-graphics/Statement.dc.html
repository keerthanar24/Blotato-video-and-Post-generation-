<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@1,6..72,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; background: #0E1014; }
    a { color: #E29A52; } a:hover { color: #F0B876; }
  </style>
</helmet>
<div style="width: 1200px; height: 1200px; background: #0E1014; padding: 88px; display: flex; flex-direction: column; box-sizing: border-box; font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <div style="width: 30px; height: 3px; background: {{accent}};"></div>
    <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 20px; font-weight: 600; letter-spacing: 0.2em; color: #7C838D;">VALUECART</div>
  </div>

  <p style="margin: 64px 0 0; font-family: Newsreader, Georgia, serif; font-style: italic; font-size: 44px; line-height: 1.32; color: #8E959F; max-width: 820px;">What's stopping your brand from entering India?</p>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="font-size: 138px; font-weight: 800; line-height: 1.0; letter-spacing: -0.045em; color: #F2EFEA;">Not demand.</div>
    <div style="font-size: 138px; font-weight: 800; line-height: 1.0; letter-spacing: -0.045em; color: {{accent}};">The operating</div>
    <div style="font-size: 138px; font-weight: 800; line-height: 1.0; letter-spacing: -0.045em; color: {{accent}};">model.</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="height: 1px; background: #262B33;"></div>
  <div style="margin-top: 26px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 19px; font-weight: 500; letter-spacing: 0.14em; line-height: 1.7; color: #6E757F;">COMPLIANCE &nbsp;·&nbsp; CUSTOMS &nbsp;·&nbsp; MARKETPLACES &nbsp;·&nbsp; LANDED COST<br>INVENTORY &nbsp;·&nbsp; FULFILLMENT &nbsp;·&nbsp; DAILY OWNERSHIP</div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#E29A52","options":["#E29A52","#35B9B4","#D4644A","#F2EFEA"],"section":"Brand"}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#E29A52' };
  }
}
</script>
</body>
</html>
