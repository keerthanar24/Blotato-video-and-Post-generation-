<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@1,6..72,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; background: #0E1014; }
    a { color: #E29A52; } a:hover { color: #F0B876; }
  </style>
</helmet>
<div style="width: 1200px; height: 1200px; background: #0E1014; padding: 88px; display: flex; flex-direction: column; box-sizing: border-box; font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <div style="width: 30px; height: 3px; background: {{accent}};"></div>
    <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 20px; font-weight: 600; letter-spacing: 0.2em; color: #7C838D;">VALUECART</div>
  </div>

  <div style="display: flex; align-items: flex-start; gap: 44px; margin-top: 34px;">
    <div style="font-size: 300px; font-weight: 800; line-height: 0.78; letter-spacing: -0.06em; color: {{accent}}; flex: none;">7</div>
    <div style="padding-top: 22px;">
      <div style="font-size: 60px; font-weight: 800; line-height: 1.06; letter-spacing: -0.03em; color: #F2EFEA;">questions between<br>your brand<br>and India</div>
      <div style="margin-top: 20px; font-family: Newsreader, Georgia, serif; font-style: italic; font-size: 31px; color: #8E959F;">None of them are demand.</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 0; margin-top: 46px;">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="7">
      <div style="display: flex; align-items: center; gap: 26px; padding: 17px 0; border-top: 1px solid #22272F;">
        <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 20px; font-weight: 600; letter-spacing: 0.06em; color: {{accent}}; flex: none; width: 34px;">{{row.n}}</div>
        <div style="font-size: 29px; font-weight: 600; letter-spacing: -0.01em; color: #C9CDD3;">{{row.q}}</div>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 21px; font-weight: 600; letter-spacing: 0.1em; color: #F2EFEA;">ENTER WITH A STRUCTURE.</div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#E29A52","options":["#E29A52","#35B9B4","#D4644A","#F2EFEA"],"section":"Brand"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#E29A52',
      rows: [
        { n: '01', q: 'Compliance screening' },
        { n: '02', q: 'Customs and import documentation' },
        { n: '03', q: 'Which marketplaces first' },
        { n: '04', q: 'Landed cost and pricing' },
        { n: '05', q: 'Where inventory sits' },
        { n: '06', q: 'Fulfillment, returns, payments' },
        { n: '07', q: 'Who owns daily execution' },
      ],
    };
  }
}
</script>
</body>
</html>
