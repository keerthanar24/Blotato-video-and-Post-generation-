<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@1,6..72,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; background: #0E1014; }
    a { color: #E29A52; } a:hover { color: #F0B876; }
  </style>
</helmet>
<div style="width: 1200px; height: 1200px; background: #0E1014; padding: 88px; display: flex; flex-direction: column; box-sizing: border-box; font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <div style="width: 30px; height: 3px; background: {{accent}};"></div>
    <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 20px; font-weight: 600; letter-spacing: 0.2em; color: #7C838D;">VALUECART</div>
  </div>

  <h1 style="margin: 30px 0 0; font-size: 84px; font-weight: 800; line-height: 1.04; letter-spacing: -0.03em; color: #F2EFEA; max-width: 940px; text-wrap: balance;">What's stopping your brand from entering India?</h1>

  <p style="margin: 30px 0 0; font-family: Newsreader, Georgia, serif; font-style: italic; font-size: 38px; line-height: 1.3; color: {{accent}};">It isn't demand.</p>

  <div style="display: flex; flex-direction: column; gap: 22px; margin-top: 46px;">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="7">
      <div style="display: flex; align-items: center; gap: 24px;">
        <div style="width: 34px; height: 34px; flex: none; border: 2px solid #3A414B; border-radius: 5px;"></div>
        <div style="font-size: 32px; font-weight: 600; letter-spacing: -0.01em; color: #C9CDD3;">{{row.q}}</div>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="height: 1px; background: #262B33;"></div>
  <div style="margin-top: 28px; display: flex; align-items: baseline; gap: 18px;">
    <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 21px; font-weight: 600; letter-spacing: 0.1em; color: #F2EFEA;">SEVEN ANSWERS.</div>
    <div style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 21px; font-weight: 500; letter-spacing: 0.1em; color: #7C838D;">ONE OPERATING PARTNER.</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#E29A52","options":["#E29A52","#35B9B4","#D4644A","#F2EFEA"],"section":"Brand"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#E29A52',
      rows: [
        { q: 'Who handles compliance screening?' },
        { q: 'How do customs and import documents work?' },
        { q: 'Which marketplaces come first?' },
        { q: "What's the right landed cost?" },
        { q: 'Where does inventory sit?' },
        { q: 'Who runs fulfillment, returns and payments?' },
        { q: 'Who owns execution, every day?' },
      ],
    };
  }
}
</script>
</body>
</html>
